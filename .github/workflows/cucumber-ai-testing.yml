name: 🤖 AI-Powered Cucumber Testing Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC for regression testing
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
          - ui
      browser:
        description: 'Browser for UI Tests'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - safari
      ai_analysis:
        description: 'Enable AI Test Analysis'
        required: false
        default: true
        type: boolean

env:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  ai-test-planning:
    name: 🧠 AI Test Planning & Analysis
    runs-on: ubuntu-latest
    outputs:
      test-strategy: ${{ steps.ai-analysis.outputs.strategy }}
      risk-areas: ${{ steps.ai-analysis.outputs.risks }}
      test-priority: ${{ steps.ai-analysis.outputs.priority }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔍 Analyze Code Changes
        id: change-analysis
        run: |
          echo "🔄 Analyzing changed files..."
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Categorize changes
          FEATURE_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.(feature|gherkin)$' | wc -l)
          JAVA_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.java$' | wc -l)
          CONFIG_CHANGES=$(echo "$CHANGED_FILES" | grep -E '\.(xml|yml|yaml|properties)$' | wc -l)
          
          echo "feature-changes=$FEATURE_CHANGES" >> $GITHUB_OUTPUT
          echo "java-changes=$JAVA_CHANGES" >> $GITHUB_OUTPUT
          echo "config-changes=$CONFIG_CHANGES" >> $GITHUB_OUTPUT
          
      - name: 🤖 AI Test Strategy Generation
        id: ai-analysis
        run: |
          echo "🧠 Generating AI-powered test strategy..."
          
          # AI-driven test prioritization logic
          FEATURE_CHANGES=${{ steps.change-analysis.outputs.feature-changes }}
          JAVA_CHANGES=${{ steps.change-analysis.outputs.java-changes }}
          CONFIG_CHANGES=${{ steps.change-analysis.outputs.config-changes }}
          
          # Generate test strategy based on changes
          if [ $FEATURE_CHANGES -gt 0 ]; then
            STRATEGY="comprehensive"
            PRIORITY="high"
            RISKS="feature-logic,ui-interactions,data-flows"
          elif [ $JAVA_CHANGES -gt 0 ]; then
            STRATEGY="targeted"
            PRIORITY="medium"
            RISKS="step-definitions,business-logic,integrations"
          elif [ $CONFIG_CHANGES -gt 0 ]; then
            STRATEGY="smoke"
            PRIORITY="low"
            RISKS="configuration,environment-setup"
          else
            STRATEGY="regression"
            PRIORITY="medium"
            RISKS="existing-functionality"
          fi
          
          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "risks=$RISKS" >> $GITHUB_OUTPUT  
          echo "priority=$PRIORITY" >> $GITHUB_OUTPUT
          
          echo "📊 AI Analysis Results:"
          echo "  Strategy: $STRATEGY"
          echo "  Priority: $PRIORITY" 
          echo "  Risk Areas: $RISKS"

  cross-browser-matrix:
    name: 🌐 Cross-Browser Test Matrix
    runs-on: ubuntu-latest
    needs: ai-test-planning
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    
    steps:
      - name: 🎯 Generate Test Matrix
        id: generate-matrix
        run: |
          echo "🌐 Generating cross-browser test matrix..."
          
          STRATEGY="${{ needs.ai-test-planning.outputs.test-strategy }}"
          
          case $STRATEGY in
            "comprehensive")
              MATRIX='{"browser":["chrome","firefox","edge"],"os":["ubuntu-latest","windows-latest"],"include":[{"browser":"safari","os":"macos-latest"}]}'
              ;;
            "targeted")
              MATRIX='{"browser":["chrome","firefox"],"os":["ubuntu-latest"]}'
              ;;
            "smoke")
              MATRIX='{"browser":["chrome"],"os":["ubuntu-latest"]}'
              ;;
            *)
              MATRIX='{"browser":["chrome","firefox"],"os":["ubuntu-latest"]}'
              ;;
          esac
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"

  cucumber-ai-testing:
    name: 🥒 Cucumber Tests (${{ matrix.browser }}-${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [ai-test-planning, cross-browser-matrix]
    strategy:
      matrix: ${{ fromJson(needs.cross-browser-matrix.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven
          
      - name: 🗂️ Cache Maven Dependencies  
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: 🌐 Setup Browser Environment
        run: |
          echo "🌐 Setting up ${{ matrix.browser }} browser environment..."
          
          case "${{ matrix.browser }}" in
            "chrome")
              # Chrome is pre-installed on GitHub runners
              google-chrome --version
              ;;
            "firefox")
              sudo apt-get update
              sudo apt-get install -y firefox
              firefox --version
              ;;
            "edge")
              if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
                sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
                sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge-dev.list'
                sudo apt update
                sudo apt install -y microsoft-edge-stable
              fi
              ;;
          esac
          
      - name: 🔧 Configure Test Environment
        run: |
          echo "🔧 Configuring test environment for ${{ matrix.browser }}..."
          
          # Set browser-specific system properties
          echo "BROWSER=${{ matrix.browser }}" >> $GITHUB_ENV
          echo "TEST_STRATEGY=${{ needs.ai-test-planning.outputs.test-strategy }}" >> $GITHUB_ENV
          echo "RISK_AREAS=${{ needs.ai-test-planning.outputs.risk-areas }}" >> $GITHUB_ENV
          
          # Create test results directory
          mkdir -p test-results/cucumber-reports
          mkdir -p test-results/screenshots
          mkdir -p test-results/ai-analysis
          
      - name: 🧪 Run Cucumber Tests
        run: |
          echo "🧪 Running Cucumber tests with AI-enhanced configuration..."
          
          # Determine test tags based on AI strategy
          STRATEGY="${{ needs.ai-test-planning.outputs.test-strategy }}"
          
          case $STRATEGY in
            "comprehensive")
              TAGS="not @skip"
              ;;
            "targeted")
              TAGS="@smoke or @regression"
              ;;
            "smoke")
              TAGS="@smoke"
              ;;
            *)
              TAGS="@regression"
              ;;
          esac
          
          echo "Running tests with tags: $TAGS"
          
          mvn clean test \
            -Dcucumber.filter.tags="$TAGS" \
            -Dbrowser=${{ matrix.browser }} \
            -Dtest.strategy=$STRATEGY \
            -Dheadless=true \
            -Dparallel.count=2 \
            -Dcucumber.plugin="pretty,html:test-results/cucumber-reports,json:test-results/cucumber.json,junit:test-results/junit.xml" \
            -Dmaven.test.failure.ignore=true
            
      - name: 📊 AI Test Analysis
        if: always()
        run: |
          echo "🤖 Performing AI-powered test analysis..."
          
          # Analyze test results with AI insights
          FAILED_TESTS=$(grep -o '"status": "failed"' test-results/cucumber.json | wc -l || echo "0")
          PASSED_TESTS=$(grep -o '"status": "passed"' test-results/cucumber.json | wc -l || echo "0")
          SKIPPED_TESTS=$(grep -o '"status": "skipped"' test-results/cucumber.json | wc -l || echo "0")
          
          TOTAL_TESTS=$((FAILED_TESTS + PASSED_TESTS + SKIPPED_TESTS))
          
          if [ $TOTAL_TESTS -gt 0 ]; then
            SUCCESS_RATE=$(echo "scale=2; $PASSED_TESTS * 100 / $TOTAL_TESTS" | bc -l)
          else
            SUCCESS_RATE=0
          fi
          
          # AI-powered failure analysis
          if [ $FAILED_TESTS -gt 0 ]; then
            echo "🔍 AI Failure Analysis:"
            echo "  - Failed Tests: $FAILED_TESTS"
            echo "  - Success Rate: $SUCCESS_RATE%"
            echo "  - Risk Areas Validated: ${{ needs.ai-test-planning.outputs.risk-areas }}"
            
            # Generate AI recommendations
            if (( $(echo "$SUCCESS_RATE < 80" | bc -l) )); then
              echo "🚨 AI Recommendation: High failure rate detected. Consider:"
              echo "  - Reviewing recent code changes"
              echo "  - Updating test data or selectors"
              echo "  - Checking environment stability"
            fi
          fi
          
          # Save AI analysis results
          cat > test-results/ai-analysis/analysis.json << EOF
          {
            "browser": "${{ matrix.browser }}",
            "os": "${{ matrix.os }}",
            "strategy": "${{ needs.ai-test-planning.outputs.test-strategy }}",
            "total_tests": $TOTAL_TESTS,
            "passed": $PASSED_TESTS,
            "failed": $FAILED_TESTS,
            "skipped": $SKIPPED_TESTS,
            "success_rate": $SUCCESS_RATE,
            "risk_areas": "${{ needs.ai-test-planning.outputs.risk-areas }}"
          }
          EOF
          
      - name: 📸 Capture Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.os }}
          path: |
            test-results/
            target/surefire-reports/
            *.log
          retention-days: 30
          
      - name: 📈 Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Cucumber Tests (${{ matrix.browser }}-${{ matrix.os }})
          path: test-results/junit.xml
          reporter: java-junit

  ai-insights-report:
    name: 🧠 AI Insights & Recommendations
    runs-on: ubuntu-latest
    needs: cucumber-ai-testing
    if: always()
    
    steps:
      - name: 📥 Download Test Results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
          path: aggregated-results/
          
      - name: 🤖 Generate AI Insights Report
        run: |
          echo "🧠 Generating comprehensive AI insights report..."
          
          mkdir -p ai-insights
          
          # Aggregate results from all browser/OS combinations
          TOTAL_FAILED=0
          TOTAL_PASSED=0
          TOTAL_SKIPPED=0
          
          for file in aggregated-results/*/ai-analysis/analysis.json; do
            if [ -f "$file" ]; then
              FAILED=$(jq -r '.failed' "$file" 2>/dev/null || echo "0")
              PASSED=$(jq -r '.passed' "$file" 2>/dev/null || echo "0")
              SKIPPED=$(jq -r '.skipped' "$file" 2>/dev/null || echo "0")
              
              TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
              TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
              TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
            fi
          done
          
          TOTAL_TESTS=$((TOTAL_FAILED + TOTAL_PASSED + TOTAL_SKIPPED))
          
          if [ $TOTAL_TESTS -gt 0 ]; then
            OVERALL_SUCCESS_RATE=$(echo "scale=2; $TOTAL_PASSED * 100 / $TOTAL_TESTS" | bc -l)
          else
            OVERALL_SUCCESS_RATE=0
          fi
          
          # Generate comprehensive AI report
          cat > ai-insights/ai-report.md << EOF
          # 🤖 AI-Powered Test Analysis Report
          
          ## 📊 Test Execution Summary
          - **Total Tests**: $TOTAL_TESTS
          - **Passed**: $TOTAL_PASSED ✅
          - **Failed**: $TOTAL_FAILED ❌
          - **Skipped**: $TOTAL_SKIPPED ⏭️
          - **Success Rate**: $OVERALL_SUCCESS_RATE%
          
          ## 🧠 AI Insights
          
          ### Test Strategy Effectiveness
          The AI-recommended strategy was: **${{ needs.ai-test-planning.outputs.test-strategy }}**
          
          ### Risk Areas Analysis
          Focus areas identified: **${{ needs.ai-test-planning.outputs.risk-areas }}**
          
          ### AI Recommendations
          EOF
          
          # Add AI-powered recommendations
          if (( $(echo "$OVERALL_SUCCESS_RATE >= 95" | bc -l) )); then
            cat >> ai-insights/ai-report.md << EOF
          ✅ **Excellent test performance!** 
          - Consider reducing test redundancy for faster execution
          - Expand test coverage for edge cases
          EOF
          elif (( $(echo "$OVERALL_SUCCESS_RATE >= 80" | bc -l) )); then
            cat >> ai-insights/ai-report.md << EOF
          🟡 **Good test performance with room for improvement**
          - Investigate intermittent failures
          - Consider stabilizing test environment
          - Review test data management
          EOF
          else
            cat >> ai-insights/ai-report.md << EOF
          🚨 **Test suite needs attention!**
          - Immediate review of failing tests required
          - Check for environmental issues
          - Consider test refactoring or updating selectors
          - Review recent code changes for breaking impacts
          EOF
          fi
          
          cat >> ai-insights/ai-report.md << EOF
          
          ## 🔮 Future AI Enhancements
          - **Smart Test Generation**: Auto-generate tests from user stories
          - **Predictive Failure Analysis**: ML-based failure prediction
          - **Self-Healing Tests**: Auto-fix common selector issues
          - **Performance Anomaly Detection**: AI-powered performance monitoring
          
          ---
          Generated by AI Testing Pipeline on $(date)
          EOF
          
      - name: 📤 Upload AI Insights
        uses: actions/upload-artifact@v4
        with:
          name: ai-insights-report
          path: ai-insights/
          retention-days: 60

  deployment-readiness:
    name: 🚀 Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [cucumber-ai-testing, ai-insights-report]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 🎯 AI Deployment Decision
        run: |
          echo "🤖 AI-powered deployment readiness assessment..."
          
          # This would integrate with your deployment pipeline
          # Based on test results, determine deployment readiness
          
          echo "✅ Deployment readiness check completed"
          echo "📋 Next steps:"
          echo "  - Review AI insights report"
          echo "  - Validate critical path tests"  
          echo "  - Monitor post-deployment metrics" 