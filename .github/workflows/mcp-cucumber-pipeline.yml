name: 🤖 MCP-Enhanced Cucumber Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Type'
        required: true
        default: 'smart'
        type: choice
        options:
          - all
          - smart
          - smoke

env:
  JAVA_VERSION: '22'
  MCP_ENABLED: true

jobs:
  mcp-test-analysis:
    name: 🧠 MCP AI Test Analysis
    runs-on: ubuntu-latest
    outputs:
      test-strategy: ${{ steps.mcp-analysis.outputs.strategy }}
      selected-tests: ${{ steps.mcp-analysis.outputs.tests }}
      risk-level: ${{ steps.mcp-analysis.outputs.risk }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🤖 MCP AI Analysis
        id: mcp-analysis
        run: |
          echo "🧠 MCP: Analyzing repository for intelligent test selection..."
          
          # MCP Protocol: Analyze changed files
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          else
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD || echo "")
          fi
          
          echo "📁 Changed files: $CHANGED_FILES"
          
          # MCP Decision Engine: Determine test strategy
          FEATURE_CHANGES=$(echo "$CHANGED_FILES" | grep -c '\.feature$' || echo "0")
          JAVA_CHANGES=$(echo "$CHANGED_FILES" | grep -c '\.java$' || echo "0")
          
          if [ "$FEATURE_CHANGES" -gt "0" ]; then
            STRATEGY="comprehensive"
            TESTS="all"  # Run all tests (TestRunner tags commented out)
            RISK="high"
            echo "🎯 MCP Decision: Feature changes detected - comprehensive testing"
          elif [ "$JAVA_CHANGES" -gt "0" ]; then
            STRATEGY="targeted"  
            TESTS="all"  # Run all tests (TestRunner tags commented out)
            RISK="medium"
            echo "🎯 MCP Decision: Code changes detected - targeted testing"
          else
            STRATEGY="smoke"
            TESTS="all"  # Run all tests (TestRunner tags commented out)
            RISK="low"
            echo "🎯 MCP Decision: Minor changes - smoke testing"
          fi
          
          # Override with manual input if provided
          if [ "${{ github.event.inputs.test_type }}" != "" ]; then
            case "${{ github.event.inputs.test_type }}" in
              "all") STRATEGY="comprehensive"; TESTS="all"; RISK="high" ;;
              "smart") STRATEGY="targeted"; TESTS="all"; RISK="medium" ;;
              "smoke") STRATEGY="smoke"; TESTS="all"; RISK="low" ;;
            esac
            echo "🎯 MCP Override: Manual selection - ${{ github.event.inputs.test_type }}"
          fi
          
          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "tests=$TESTS" >> $GITHUB_OUTPUT
          echo "risk=$RISK" >> $GITHUB_OUTPUT
          
          echo "✅ MCP Analysis Complete:"
          echo "  Strategy: $STRATEGY"
          echo "  Tests: $TESTS"
          echo "  Risk: $RISK"

  mcp-cucumber-tests:
    name: 🥒 MCP-Enhanced Cucumber Tests
    runs-on: ubuntu-latest
    needs: mcp-test-analysis
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven
          
      - name: 🚀 Maven Preparation & Compilation
        run: |
          echo "📦 Downloading dependencies..."
          mvn dependency:go-offline -B -q
          echo "🔨 Compiling source and test classes..."
          mvn compile test-compile -B -q
          echo "✅ Compilation complete"
          
          # Verify TestRunner class exists
          if [ -f "target/test-classes/runner/TestRunner.class" ]; then
            echo "✅ TestRunner class found: target/test-classes/runner/TestRunner.class"
          else
            echo "❌ TestRunner class NOT found - checking directory..."
            find target/test-classes -name "*.class" | head -10
          fi
          
      - name: 🤖 MCP Test Execution
        run: |
          echo "🚀 MCP: Executing AI-selected test strategy..."
          echo "📋 Strategy: ${{ needs.mcp-test-analysis.outputs.test-strategy }}"
          echo "🎯 Tests: ${{ needs.mcp-test-analysis.outputs.selected-tests }}"
          echo "⚠️ Risk Level: ${{ needs.mcp-test-analysis.outputs.risk-level }}"
          echo "💡 Running naturally like your terminal environment"
          
          # Create MCP test results directory
          mkdir -p mcp-results
          
          # Run tests through TestRunner class with MCP-selected strategy
          echo "🔧 MCP: Configuring TestRunner to run exactly like IntelliJ..."
          echo "📋 Selected tests: ${{ needs.mcp-test-analysis.outputs.selected-tests }}"
          echo "💡 MCP: Your original code + minimal CI headless mode"
          echo "🎯 Primary Target: runner.TestRunner (full package name)"
          echo "🎯 Fallback 1: TestRunner (simple class name)"
          echo "🎯 Fallback 2: mvn test (all tests if TestRunner fails)"
          echo "🎯 Command: mvn test -Dtest=runner.TestRunner + CI_HEADLESS=true"
          
          # Show execution setup
          echo "🔍 MCP: Using your exact IntelliJ code with CI headless mode..."
          echo "💡 Code: Your original WebDriverManager + step definitions (unchanged)"
          echo "💡 Chrome: Only headless mode added for CI (via CI_HEADLESS env var)"
          echo "💡 Maven: Running TestRunner exactly like IntelliJ"  
          echo "💡 Reports: Complete output like your local runs"
          echo ""
          echo "📋 All scenarios will execute:"
          echo "  ✅ searching for a product (@T1)"
          echo "  ✅ adding product to cart (@T1)" 
          echo "  ✅ checking product is in cart page (@T1)"
          echo "  ✅ Remove item from cart (@T1)"
          echo "  ✅ Clean up (@T2)"
          echo "  ✅ Password Validations - 3 examples (@L3)"
          echo "  ✅ Register Staples user (@L9)"
          echo "  ✅ Phone format test (@L10)"
          echo "🎯 Goal: Same behavior as IntelliJ, just headless for GitHub"
          
          # Verify TestRunner is accessible before execution
          echo "🔍 Verifying TestRunner class accessibility..."
          if [ -f "target/test-classes/runner/TestRunner.class" ]; then
            echo "✅ TestRunner class verified: runner.TestRunner"
          else
            echo "❌ TestRunner class missing! Available test classes:"
            find target/test-classes -name "TestRunner*" -o -name "*Runner*" 2>/dev/null || echo "No Runner classes found"
            ls -la target/test-classes/ 2>/dev/null || echo "target/test-classes directory missing"
          fi
          
          # Run all tests through TestRunner class (natural execution like terminal)
          echo "🚀 Starting Maven test execution (natural pace)..."
          
          # Set environment variable to enable headless mode for CI only
          export CI_HEADLESS=true
          
          # Run tests exactly like your IntelliJ but with CI headless mode
          mvn clean test \
            -Dtest=runner.TestRunner \
            -Dcucumber.plugin="pretty,html:target/cucumber-reports.html,json:mcp-results/cucumber.json,junit:mcp-results/junit.xml" \
            -Dmcp.strategy="${{ needs.mcp-test-analysis.outputs.test-strategy }}" \
            -Dmcp.risk="${{ needs.mcp-test-analysis.outputs.risk-level }}" \
            -Dmcp.tags="${{ needs.mcp-test-analysis.outputs.selected-tests }}" \
            -Dmaven.test.failure.ignore=true
          
          TEST_EXIT_CODE=$?
          echo "📊 Maven test execution completed with exit code: $TEST_EXIT_CODE (natural execution)"
          
          # If first approach failed, try alternative approaches
          if [ $TEST_EXIT_CODE -ne 0 ] || [ ! -f "mcp-results/cucumber.json" ]; then
            echo "⚠️ Primary approach failed, trying alternative methods (natural execution)..."
            
            # Alternative 1: Try without package name
            echo "🔄 Trying: mvn test -Dtest=TestRunner (with CI headless mode)"
            export CI_HEADLESS=true
            mvn test -Dtest=TestRunner -Dcucumber.plugin="pretty,html:target/cucumber-reports.html,json:mcp-results/cucumber.json,junit:mcp-results/junit.xml" -Dmaven.test.failure.ignore=true
            
            # Alternative 2: Try running all tests if TestRunner still fails
            if [ ! -f "mcp-results/cucumber.json" ]; then
              echo "🔄 Trying: mvn test (run all tests with CI headless mode)"
              export CI_HEADLESS=true
              mvn test -Dcucumber.plugin="pretty,html:target/cucumber-reports.html,json:mcp-results/cucumber.json,junit:mcp-results/junit.xml" -Dmaven.test.failure.ignore=true
            fi
          fi
          
          # Verify test results were generated
          if [ -f "mcp-results/cucumber.json" ]; then
            echo "✅ Test results generated: mcp-results/cucumber.json"
            echo "📊 Result file size: $(wc -c < mcp-results/cucumber.json) bytes"
            
            # Show brief summary of what ran
            SCENARIOS_COUNT=$(jq -r '[.[] | .elements[]] | length' mcp-results/cucumber.json 2>/dev/null || echo "0")
            echo "📊 Scenarios executed: $SCENARIOS_COUNT"
          else
            echo "❌ No test results found in mcp-results/cucumber.json"
            echo "📁 Available files in mcp-results/:"
            ls -la mcp-results/ 2>/dev/null || echo "mcp-results directory missing"
            echo "📁 Available files in target/:"
            ls -la target/ 2>/dev/null || echo "target directory missing"
            
            # Check surefire reports as backup
            if [ -d "target/surefire-reports" ]; then
              echo "📁 Surefire reports found:"
              ls -la target/surefire-reports/
            fi
          fi
            
      - name: 🧠 MCP Results Analysis
        if: always()
        run: |
          echo "🤖 MCP: Analyzing test results..."
          echo "🎯 Analyzed all test scenarios naturally"
          
          # Parse test results using MCP protocol
          if [ -f "mcp-results/cucumber.json" ]; then
            TOTAL_SCENARIOS=$(jq -r '[.[] | .elements[] | .steps[]] | length' mcp-results/cucumber.json 2>/dev/null || echo "0")
            PASSED_STEPS=$(jq -r '[.[] | .elements[] | .steps[] | select(.result.status == "passed")] | length' mcp-results/cucumber.json 2>/dev/null || echo "0")
            FAILED_STEPS=$(jq -r '[.[] | .elements[] | .steps[] | select(.result.status == "failed")] | length' mcp-results/cucumber.json 2>/dev/null || echo "0")
            
            # Count actual scenarios run
            SCENARIOS_RUN=$(jq -r '[.[] | .elements[]] | length' mcp-results/cucumber.json 2>/dev/null || echo "0")
            echo "📋 Total scenarios executed: $SCENARIOS_RUN (natural execution like terminal)"
          else
            TOTAL_SCENARIOS=0
            PASSED_STEPS=0
            FAILED_STEPS=0
            SCENARIOS_RUN=0
            echo "⚠️ No test results found - check test execution"
          fi
          
          # MCP Intelligence: Calculate success metrics
          if [ "$TOTAL_SCENARIOS" -gt "0" ]; then
            SUCCESS_RATE=$(echo "scale=2; $PASSED_STEPS * 100 / ($PASSED_STEPS + $FAILED_STEPS)" | bc -l 2>/dev/null || echo "0")
          else
            SUCCESS_RATE=0
          fi
          
          # MCP Insights Generation
          echo "📊 MCP Test Results:"
          echo "  Total Steps: $TOTAL_SCENARIOS"
          echo "  Passed: $PASSED_STEPS ✅"
          echo "  Failed: $FAILED_STEPS ❌"
          echo "  Success Rate: $SUCCESS_RATE%"
          
          # MCP Recommendations
          echo "🤖 MCP Recommendations:"
          if (( $(echo "$SUCCESS_RATE >= 90" | bc -l 2>/dev/null || echo "0") )); then
            echo "  ✅ Excellent! All test scenarios are stable and reliable"
            echo "  🎯 Ready for deployment"
          elif (( $(echo "$SUCCESS_RATE >= 70" | bc -l 2>/dev/null || echo "0") )); then
            echo "  🟡 Good performance, minor issues detected across test suite"
            echo "  🔧 Consider reviewing failed tests"
          else
            echo "  🚨 Multiple failures detected across test scenarios"
            echo "  🛑 Review required before deployment" 
            echo "  🔍 Check logs and screenshots"
            echo "  💡 Focus on: BestBuy functionality, login flows, form validations"
          fi
          
          # Save MCP analysis
          cat > mcp-results/mcp-analysis.json << EOF
          {
            "mcp_version": "1.0",
            "strategy": "${{ needs.mcp-test-analysis.outputs.test-strategy }}",
            "risk_level": "${{ needs.mcp-test-analysis.outputs.risk-level }}",
            "total_steps": $TOTAL_SCENARIOS,
            "passed_steps": $PASSED_STEPS,
            "failed_steps": $FAILED_STEPS,
            "success_rate": $SUCCESS_RATE,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
      - name: 📊 Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: MCP Cucumber Results
          path: mcp-results/junit.xml
          reporter: java-junit
          fail-on-error: false
          
      - name: 📤 Upload MCP Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-results
          path: |
            mcp-results/
            target/cucumber-reports.html
          retention-days: 30

  mcp-deployment-check:
    name: 🚀 MCP Deployment Readiness
    runs-on: ubuntu-latest
    needs: mcp-cucumber-tests
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Download MCP Results
        uses: actions/download-artifact@v4
        with:
          name: mcp-test-results
          path: mcp-analysis/
          
      - name: 🤖 MCP Deployment Decision
        run: |
          echo "🤖 MCP: Evaluating deployment readiness..."
          
          if [ -f "mcp-analysis/mcp-analysis.json" ]; then
            SUCCESS_RATE=$(jq -r '.success_rate' mcp-analysis/mcp-analysis.json 2>/dev/null || echo "0")
            RISK_LEVEL=$(jq -r '.risk_level' mcp-analysis/mcp-analysis.json 2>/dev/null || echo "unknown")
            
            echo "📊 Current Metrics (natural execution - all test scenarios):"
            echo "  Success Rate: $SUCCESS_RATE%"
            echo "  Risk Level: $RISK_LEVEL"
            echo "  Coverage: Complete test suite (BestBuy + Login functionality)"
            echo "  Execution: Natural pace like terminal environment"
            
            # MCP Deployment Logic
            if (( $(echo "$SUCCESS_RATE >= 85" | bc -l 2>/dev/null || echo "0") )); then
              echo "✅ MCP Decision: DEPLOY READY"
              echo "🚀 All quality gates passed with natural execution"
              echo "🎯 BestBuy and Login functionality verified (terminal-like behavior)"
              echo "deployment_ready=true" >> $GITHUB_ENV
            else
              echo "🛑 MCP Decision: DEPLOY BLOCKED"
              echo "❌ Quality gates failed with natural execution"
              echo "🔧 Manual review required - check all functionality"
              echo "deployment_ready=false" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ MCP: No analysis data found"
            echo "🛑 Deployment blocked due to missing data"
            echo "deployment_ready=false" >> $GITHUB_ENV
          fi
          
          echo "🎯 MCP Pipeline Complete!" 